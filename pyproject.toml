[project]
name = "studip-router"
version = "0.2.0"
description = "Sync Stud.IP course files into your own folder structure, with per-course routing and renaming rules."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Noah Bomers" }]
requires-python = ">=3.11"
keywords = ["studip", "stud.ip", "university", "sync", "download", "cli", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
# Upper bounds: a new major version is tested before users get it (textual: the
# crash handler overrides a private method, see tui/app.py).
dependencies = [
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "platformdirs>=4.0,<5",
    "keyring>=25.0,<26",
    "pypdf[crypto]>=5,<7",
    "textual>=1.0,<9",
    "tomlkit>=0.13,<1",
    "truststore>=0.10,<1",
]

[project.urls]
Homepage = "https://github.com/nbomers/studip-router"
Issues = "https://github.com/nbomers/studip-router/issues"

[project.scripts]
studip = "studip_router.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
packages = ["studip_router"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
