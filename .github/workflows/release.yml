name: Release

# Publishes to PyPI when a version tag (v1.2.3) is pushed. Uses PyPI Trusted
# Publishing: no token is stored anywhere, PyPI trusts this workflow file of this
# repository in the "pypi" environment (configured once on pypi.org).
#
# Started by hand (Actions -> Release -> Run workflow) it is a dry run: the same
# checks, build and artifact hand-over, but the publish job does not run. Use it
# after the workflow or its actions changed, before tagging a real release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Tag matches the package version
        run: |
          version=$(uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          code=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/studip_router/__init__.py)
          echo "ref ${GITHUB_REF_NAME}, pyproject ${version}, __version__ ${code}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF_NAME}" = "v${version}"
          fi
          test "${version}" = "${code}"
          grep -q "^## \[${version}\]" CHANGELOG.md
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
        env:
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
      - run: uv build
      - name: Smoke test the built wheel
        run: uv run --isolated --no-project --with dist/*.whl studip --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  dry-run:
    # Manual runs only: proves the artifact hand-over between jobs works
    # without uploading anything.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Wheel and sdist arrived
        run: |
          ls -l dist/
          ls dist/*.whl dist/*.tar.gz

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/studip-router/
    permissions:
      id-token: write # only this job may prove its identity to PyPI
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
